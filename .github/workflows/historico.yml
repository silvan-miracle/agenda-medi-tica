name: Cargar histórico (una sola vez)

# Paso 16 del esquema: pasa a `tomas` las fotos guardadas en el dashboard anterior (carpeta
# historico/tomas), recalcula todos esos días y publica la web con todo el histórico.
# Es seguro repetirlo: las tomas que ya están no se tocan y los días se rehacen sin duplicar.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  historico:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TZ: Europe/Madrid
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Cargar las fotos antiguas en tomas
        run: python cargar.py historico --dir historico/tomas

      - name: Recalcular cada día (de más antiguo a más reciente)
        run: |
          for FECHA in $(ls historico/tomas | cut -c1-10 | sort -u); do
            python cargar.py bajar-tomas --fecha "$FECHA" --dir tomas_dl
            rm -rf out
            python portadas.py dia --fecha "$FECHA" --tomas tomas_dl --dir . 2>/dev/null
            python cargar.py dia --fecha "$FECHA" --dir out
          done

      - name: Publicar todo el histórico
        run: |
          python exportar.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "Sin cambios en la web."
          else
            git commit -m "Histórico cargado · $(date '+%Y-%m-%d %H:%M')"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
